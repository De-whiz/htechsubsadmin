<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Checkers - HTECHSUBS Admin Panel</title>
    <link rel="stylesheet" href="css/admin-styles.css">
    <style>
        .service-card {
            background: var(--white);
            border: 1px solid var(--border-lighter);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--border-lighter);
        }

        .service-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .level-card {
            background: var(--bg-light-secondary);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-lighter);
        }

        .level-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: var(--spacing-md);
        }

        .pricing-field {
            display: flex;
            flex-direction: column;
            margin-bottom: var(--spacing-md);
        }

        .pricing-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: var(--spacing-xs);
        }

        .pricing-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .service-toggle {
            width: 50px;
            height: 26px;
            background: var(--border-lighter);
            border: none;
            border-radius: 13px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .service-toggle.enabled {
            background: var(--success);
        }

        .service-toggle::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: var(--white);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }

        .service-toggle.enabled::after {
            left: 26px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: var(--white);
            margin: 5% auto;
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--border-lighter);
            padding-bottom: var(--spacing-lg);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .modal-field {
            display: flex;
            flex-direction: column;
        }

        .modal-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: var(--spacing-xs);
        }

        .modal-input {
            padding: var(--spacing-sm);
            border: 1px solid var(--border-lighter);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            color: var(--text-dark);
            background: var(--white);
            box-sizing: border-box;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 3px rgba(108, 59, 255, 0.1);
        }

        .calculation-preview {
            background: var(--bg-light-secondary);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
        }

        .preview-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .preview-label {
            color: var(--text-light);
        }

        .preview-value {
            font-weight: 600;
            color: var(--primary-purple);
        }

        .modal-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: flex-end;
        }

        .edit-btn {
            display: inline-block;
            padding: 6px 12px;
        }

        @media (max-width: 768px) {
            .levels-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                margin: 20% auto;
            }

            .modal-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

            <nav class="navbar"><div class="navbar-left"><button class="navbar-toggle-btn" id="sidebarToggle">☰</button><div class="navbar-breadcrumb"><a href="index.html">Dashboard</a><span>/</span><span>Exam Checkers</span></div></div><div class="navbar-right"><button class="navbar-action-btn" onclick="logout()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button></div></nav>

            <div class="content">
                <h1 style="font-size: 28px; font-weight: 700; color: var(--text-dark); margin-bottom: var(--spacing-md);">Exam Checkers Pricing</h1>
                <p style="color: var(--text-light); font-size: 14px; margin-bottom: var(--spacing-xl);">Configure markup percent for exam checker services by user level</p>

                <div id="servicesContainer"></div>
            </div>

    <script src="js/admin-functions.js"></script>
    <script>
        if(localStorage.getItem('adminLogged')!=='true'){window.location.href='login.html';}

        const services = [
            { 
                id: 'waec', 
                name: 'WAEC Checker',
                enabled: true,
                level1: { costPrice: 800, markupPercent: 10 },
                level2: { costPrice: 800, markupPercent: 8 }
            },
            { 
                id: 'jamb', 
                name: 'JAMB Checker',
                enabled: true,
                level1: { costPrice: 1500, markupPercent: 8 },
                level2: { costPrice: 1500, markupPercent: 6 }
            },
            { 
                id: 'neco', 
                name: 'NECO Checker',
                enabled: true,
                level1: { costPrice: 600, markupPercent: 12 },
                level2: { costPrice: 600, markupPercent: 9 }
            }
        ];

        function calculateSellingPrice(cost, markup) {
            return cost + (cost * markup / 100);
        }

        function renderServices() {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = '';

            const html = `
                <div class="card">
                    <div style="padding: var(--spacing-lg); border-bottom: 2px solid var(--border-lighter); margin-bottom: var(--spacing-lg);">
                        <h2 style="font-size: 20px; font-weight: 600; color: var(--text-dark); margin: 0;">Exam Checker Services</h2>
                        <p style="color: var(--text-light); font-size: 13px; margin: 8px 0 0 0;">Edit markup percent for Level 1 and Level 2 users - one toggle per service</p>
                    </div>

                    <div style="padding: var(--spacing-lg);">
                        ${services.map(service => `
                            <div style="margin-bottom: var(--spacing-lg); padding-bottom: var(--spacing-lg); border-bottom: 2px solid var(--border-lighter);">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md);">
                                    <div>
                                        <h3 style="font-size: 16px; font-weight: 600; color: var(--text-dark); margin: 0;">${service.name}</h3>
                                    </div>
                                    <button class="service-toggle enabled" onclick="toggleExamService('${service.id}')" title="Toggle service status"></button>
                                </div>
                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--spacing-lg);">
                                    <div style="padding: var(--spacing-md); background: var(--bg-light-secondary); border-radius: var(--radius-md);">
                                        <div style="font-size: 13px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: var(--spacing-md);">Level 1 Users</div>
                                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
                                            <div class="pricing-field">
                                                <label class="pricing-label" style="margin-bottom: 4px;">Markup %</label>
                                                <input type="number" class="pricing-input level1-markup" id="l1_markup_${service.id}" data-service-id="${service.id}" value="${service.level1.markupPercent}" step="0.1" min="0">
                                            </div>
                                            <div style="text-align: right;">
                                                <div style="font-size: 12px; color: var(--text-light); margin-bottom: 4px;">Selling Price</div>
                                                <div style="font-size: 16px; font-weight: 600; color: var(--success);">₦<span class="l1-selling-${service.id}">${Math.round(calculateSellingPrice(service.level1.costPrice, service.level1.markupPercent)).toLocaleString()}</span></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div style="padding: var(--spacing-md); background: var(--bg-light-secondary); border-radius: var(--radius-md);">
                                        <div style="font-size: 13px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: var(--spacing-md);">Level 2 Users</div>
                                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
                                            <div class="pricing-field">
                                                <label class="pricing-label" style="margin-bottom: 4px;">Markup %</label>
                                                <input type="number" class="pricing-input level2-markup" id="l2_markup_${service.id}" data-service-id="${service.id}" value="${service.level2.markupPercent}" step="0.1" min="0">
                                            </div>
                                            <div style="text-align: right;">
                                                <div style="font-size: 12px; color: var(--text-light); margin-bottom: 4px;">Selling Price</div>
                                                <div style="font-size: 16px; font-weight: 600; color: var(--success);">₦<span class="l2-selling-${service.id}">${Math.round(calculateSellingPrice(service.level2.costPrice, service.level2.markupPercent)).toLocaleString()}</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="section-actions" style="padding: var(--spacing-lg); border-top: 1px solid var(--border-lighter); background: var(--bg-light-secondary); border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
                        <button class="btn btn-secondary" onclick="resetServices()">Reset</button>
                        <button class="btn btn-primary" onclick="saveAllServices()">💾 Save All Exam Checker Services</button>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            attachEventListeners();
        }

        function attachEventListeners() {
            document.querySelectorAll('.level1-markup').forEach(input => {
                input.addEventListener('input', (e) => {
                    const serviceId = e.target.dataset.serviceId;
                    const service = services.find(s => s.id === serviceId);
                    if (service) {
                        service.level1.markupPercent = parseFloat(e.target.value) || 0;
                        const selling = Math.round(calculateSellingPrice(service.level1.costPrice, service.level1.markupPercent));
                        document.querySelector(`.l1-selling-${serviceId}`).textContent = selling.toLocaleString();
                    }
                });
            });
            
            document.querySelectorAll('.level2-markup').forEach(input => {
                input.addEventListener('input', (e) => {
                    const serviceId = e.target.dataset.serviceId;
                    const service = services.find(s => s.id === serviceId);
                    if (service) {
                        service.level2.markupPercent = parseFloat(e.target.value) || 0;
                        const selling = Math.round(calculateSellingPrice(service.level2.costPrice, service.level2.markupPercent));
                        document.querySelector(`.l2-selling-${serviceId}`).textContent = selling.toLocaleString();
                    }
                });
            });
        }

        function toggleExamService(serviceId) {
            const service = services.find(s => s.id === serviceId);
            if (service) {
                service.enabled = !service.enabled;
                renderServices();
                const status = service.enabled ? 'enabled' : 'disabled';
                showToast(`${service.name} ${status}`, service.enabled ? 'success' : 'warning');
            }
        }

        function saveAllServices() {
            localStorage.setItem('exam_checker_pricing', JSON.stringify(services));
            showToast('✅ All exam checker services saved successfully!', 'success');
        }

        function resetServices() {
            renderServices();
            showToast('Exam checker services have been reset', 'info');
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? '#10B981' : type === 'warning' ? '#F59E0B' : '#3B82F6';
            toast.style.cssText = `position: fixed; bottom: 20px; right: 20px; background: ${bgColor}; color: white; padding: 16px 24px; border-radius: 8px; z-index: 10000; font-weight: 600;`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Initialize
        renderServices();

        function attachEventListeners() {
            // Level 1 markup listeners
            document.querySelectorAll('.level1-markup').forEach(input => {
                input.addEventListener('input', (e) => {
                    const serviceId = e.target.dataset.serviceId;
                    const service = services.find(s => s.id === serviceId);
                    if (service) {
                        const markup = parseFloat(e.target.value) || 0;
                        const selling = Math.round(calculateSellingPrice(service.level1.costPrice, markup));
                        document.querySelector(`.l1-selling-${serviceId}`).textContent = selling.toLocaleString();
                    }
                });
            });

            // Level 2 markup listeners
            document.querySelectorAll('.level2-markup').forEach(input => {
                input.addEventListener('input', (e) => {
                    const serviceId = e.target.dataset.serviceId;
                    const service = services.find(s => s.id === serviceId);
                    if (service) {
                        const markup = parseFloat(e.target.value) || 0;
                        const selling = Math.round(calculateSellingPrice(service.level2.costPrice, markup));
                        document.querySelector(`.l2-selling-${serviceId}`).textContent = selling.toLocaleString();
                    }
                });
            });
        }

        function saveAllServices() {
            services.forEach(service => {
                const l1Markup = parseFloat(document.getElementById(`l1_markup_${service.id}`)?.value || service.level1.markupPercent);
                const l2Markup = parseFloat(document.getElementById(`l2_markup_${service.id}`)?.value || service.level2.markupPercent);
                service.level1.markupPercent = l1Markup;
                service.level2.markupPercent = l2Markup;
            });
            localStorage.setItem('exam_checkers_pricing', JSON.stringify(services));
            showToast('✅ All exam checker services pricing saved successfully!', 'success');
        }

        function resetServices() {
            renderServices();
            showToast('Exam checker services have been reset', 'info');
        }

        // Initialize
        renderServices();
    </script>
</body>
